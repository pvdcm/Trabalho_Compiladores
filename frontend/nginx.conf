server {
    listen 80;
    server_name _;

    # Não divulga a versão do Nginx em cabeçalhos e páginas de erro.
    server_tokens off;

    # Mesmo limite de tamanho aplicado pelo backend (64 KB), com folga para o JSON.
    client_max_body_size 128k;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estáticos do frontend.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Repassa as chamadas de API ao serviço "backend" definido no docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
